# macOS example

[mcp_servers.esp32_gpio]
command = "/Users/USER/esp32-mcp-io-extender/.venv/bin/python"
args = ["-m", "esp32_mcp_io_extender.mcp_server"]
cwd = "/Users/USER/esp32-mcp-io-extender"

[mcp_servers.esp32_gpio.env]
ESP_GPIO_PORT = "/dev/tty.usbmodemXXXX"
ESP_GPIO_BAUD = "115200"
ESP_GPIO_TIMEOUT = "2.0"
ESP_GPIO_BOOT_WAIT = "0.8"
ESP_GPIO_RETRIES = "2"
ESP_GPIO_AUTO_PORT = "1"
ESP_GPIO_ENDPOINT_CONFIG = "/Users/USER/esp32-mcp-io-extender/configs/halo_syc_00048_r00_dvt2_endpoints.json"
ESP_GPIO_MCP_TOOL_SCOPE = "both"
